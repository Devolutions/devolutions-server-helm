{{- if .Values.initialization.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "devolutions-server.fullname" . }}-db-init
  labels:
    {{- include "devolutions-server.labels" . | nindent 4 }}
    component: db-init
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  parallelism: 1
  completions: 1
  activeDeadlineSeconds: {{ .Values.initialization.activeDeadlineSeconds }}
  backoffLimit: 0
  template:
    metadata:
      labels:
        {{- include "devolutions-server.selectorLabels" . | nindent 8 }}
        component: db-init
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: db-init
          image: "{{ .Values.image.repository }}:{{ include "devolutions-server.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # The entrypoint starts the server once DVLS_INIT completes and never exits on its own,
          # so the job ends on the completion line it prints.
          command:
            - /bin/bash
            - -c
            - |
              "$DVLS_EXECUTABLE_PATH" --container-entrypoint > /tmp/dvls-init.log 2>&1 &
              pid=$!
              tail -n +1 -f /tmp/dvls-init.log &
              while kill -0 "$pid" 2> /dev/null; do
                if grep -qF 'Initialization completed successfully.' /tmp/dvls-init.log; then
                  kill "$pid"
                  exit 0
                fi
                sleep 2
              done
              grep -qF 'Initialization completed successfully.' /tmp/dvls-init.log
          env:
            # DVLS Configuration
            - name: DVLS_INIT
              value: "true"
            - name: DVLS_ADMIN_USERNAME
              value: {{ .Values.dvls.admin.username | quote }}
            - name: DVLS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: {{ .Values.dvls.admin.passwordSecretKey }}
            - name: DVLS_ADMIN_EMAIL
              value: {{ required "dvls.admin.email is required" .Values.dvls.admin.email | quote }}
            - name: DVLS_PATH
              value: {{ .Values.dvls.path | quote }}
            - name: HOSTNAME
              value: {{ include "devolutions-server.hostname" . | quote }}

            # Database Configuration
            {{- with .Values.database.type }}
            - name: DATABASE_TYPE
              value: {{ . | quote }}
            {{- end }}
            - name: {{ .Values.database.envPrefix }}_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: {{ .Values.database.usernameSecretKey }}
            - name: {{ .Values.database.envPrefix }}_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: {{ .Values.database.passwordSecretKey }}
            - name: {{ .Values.database.envPrefix }}_HOST
              value: {{ include "devolutions-server.databaseHost" . | quote }}
            - name: {{ .Values.database.envPrefix }}_NAME
              value: {{ include "devolutions-server.databaseName" . | quote }}
            - name: {{ .Values.database.envPrefix }}_PORT
              value: {{ .Values.database.port | quote }}

            # Web Configuration
            - name: WEB_SCHEME
              value: {{ .Values.web.scheme | quote }}
            - name: PORT
              value: {{ .Values.web.port | quote }}
            - name: EXTERNAL_WEB_SCHEME
              value: {{ .Values.web.externalScheme | quote }}
            - name: EXTERNAL_WEB_PORT
              value: {{ .Values.web.externalPort | quote }}

            # Security and Telemetry
            - name: DVLS_TELEMETRY
              value: {{ .Values.dvls.telemetry | quote }}
            - name: DVLS_ENCRYPTION_CONFIG_B64
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: {{ .Values.dvls.encryptionConfigSecretKey }}

          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
